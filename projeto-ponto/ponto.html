<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Ponto</title>
</head>
<body>
    <!-- Este container unifica toda a página centralizada com limite de largura (1000px) -->
    <div id="container-dashboard">
        
        <header id="cabecalho-principal">
            <div>
                <p>🔵 Ponto</p>
            </div>
            
            <nav>
                <button id="botao-meu-ponto">Meu ponto</button>
                <a href="conta.html" id="botao-conta">Conta</a>
            </nav>
        </header>

        <div class="cartao-relogio-principal">
            <h1 id="visor-tempo-grade">Ponto</h1>
            <p class="letras-miudas" id="data-atual"></p>
            <div class="status-de-horario" id="status-trabalho">Carregando registros...</div>
            <!-- Botão essencial com ID para bater o ponto no banco de dados e Classe reaproveitável para design -->
            <button id="botao-bater-ponto" class="botao-vermelho-largo">Registrar entrada</button>
            <div class="texto-localizacao" id="mensagem-localizacao">Sua localização é resgistrada ao bater o ponto</div>
        </div>

        <!-- Layout construído com Floats dividindo 100% da tela em cartões de 32% com 2% de margem direita -->
        <div class="painel-resumos">
            
            <div class="cartao-resumo">
                <!-- ID incluso para o JS atualizar as horas trabalhadas em tempo real -->
                <h2 id="horas-hoje">—</h2>
                <p class="letras-do-cartao">Hoje</p>
            </div>

            <div class="cartao-resumo">
                <h2 id="horas-semana">—</h2>
                <p class="letras-do-cartao">Esta semana</p>
            </div>

            <!-- resumo-final anula os 2% de margem extra para o bloco não quebrar a linha -->
            <div class="cartao-resumo resumo-final">
                <h2 id="horas-mes">—</h2>
                <p class="letras-do-cartao">Este mês</p>
            </div>

            <!-- Essencial para que o container não ache que não tem conteúdo e diminua a altura -->
            <div class="limpar-fluxo"></div>
        </div>

        <div id="painel-historico">
            <h3 class="titulo-historico">Registros de hoje</h3>

            <div id="lista-registros">Carregando registros...</div>
        </div>
    </div>
    <script src="javascript.js" defer></script>
</body>
</html>
